<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
<title>Önértékelés – A6</title>
<style>
  :root {
    --hatter: #f6f7f9; --felulet: #ffffff; --szoveg: #1d2330; --halvany: #5b6577; --keret: #d9dde5;
    --kiemelo: #2453a6; --kiemelo-hatter: #e8eefb; --figyelem: #8a5a00; --figyelem-hatter: #fff3d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hatter: #14171d; --felulet: #1d2129; --szoveg: #e7eaf0; --halvany: #a4adbd; --keret: #343a46;
      --kiemelo: #8fb1f0; --kiemelo-hatter: #1f2a40; --figyelem: #f0c46a; --figyelem-hatter: #352a12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--hatter); color: var(--szoveg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .tartaly { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; line-height: 1.25; margin: 8px 0 4px; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  h3 { font-size: 17px; margin: 0 0 6px; }
  p { margin: 0 0 10px; }
  .alcim { color: var(--halvany); margin: 0 0 16px; }
  .kartya { background: var(--felulet); border: 1px solid var(--keret); border-radius: 10px; padding: 14px 16px; margin: 12px 0; break-inside: avoid; }
  .kartya .pakli { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--kiemelo); }
  .racs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .racs .kartya { margin: 0; }
  .szinek { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .szinminta { display: flex; flex-direction: column; align-items: center; font: 12px ui-monospace, Consolas, monospace; }
  .szinminta span { width: 56px; height: 40px; border-radius: 6px; border: 1px solid var(--keret); margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--felulet); }
  th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--keret); vertical-align: top; }
  th { font-size: 14px; color: var(--halvany); font-weight: 600; }
  .kod { font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: nowrap; }
  .megjegyzes { color: var(--halvany); font-size: 14px; }
  .kiemelt { background: var(--kiemelo-hatter); border-color: transparent; }
  .figyelem { background: var(--figyelem-hatter); color: var(--figyelem); border-color: transparent; }
  ul { margin: 0 0 10px; padding-left: 22px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 14px; background: var(--kiemelo-hatter); padding: 1px 5px; border-radius: 4px; }
  .tablazat { overflow-x: auto; }
  footer { color: var(--halvany); font-size: 13px; margin: 32px 0 16px; }
  @media print {
    body { background: #fff; color: #000; font-size: 12pt; }
    .kartya { border-color: #bbb; }
    .nyomtatas-nelkul { display: none !important; }
    h2 { break-after: avoid; }
  }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  textarea { width: 100%; min-height: 90px; font: inherit; color: var(--szoveg); background: var(--felulet);
    border: 1px solid var(--keret); border-radius: 6px; padding: 8px; resize: vertical; }
  .skala { display: flex; gap: 8px; flex-wrap: wrap; }
  .skala label { font-weight: 400; margin: 0; display: inline-flex; gap: 6px; align-items: center;
    border: 1px solid var(--keret); border-radius: 6px; padding: 6px 12px; background: var(--felulet); cursor: pointer; }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--kiemelo);
    background: var(--kiemelo); color: #fff; cursor: pointer; margin-top: 18px; }
</style>
</head>
<body>
<div class="tartaly">
<h1>Csapat-önértékelés – A6</h1>
<p class="alcim">Nem pontozott, de kérjük leadni. A gomb egy <code>A6_onertekeles.txt</code> fájlt ment; ezt töltsétek fel a leadással együtt.</p>
<form id="urlap" onsubmit="return false">
  <label for="sikerult">Mi sikerült jól?</label>
  <textarea id="sikerult"></textarea>
  <label for="nem_sikerult">Mi nem sikerült, vagy mivel küzdöttetek?</label>
  <textarea id="nem_sikerult"></textarea>
  <label for="munkamegosztas">Hogyan osztottátok meg a munkát?</label>
  <textarea id="munkamegosztas"></textarea>
  <label for="maskepp">Mit csinálnátok másképp legközelebb?</label>
  <textarea id="maskepp"></textarea>
  <label id="elegedettseg-cim">Mennyire vagytok elégedettek az eredménnyel? (1 = egyáltalán nem, 5 = nagyon)</label>
  <div class="skala" role="radiogroup" aria-labelledby="elegedettseg-cim">
<label><input type="radio" name="elegedettseg" value="1">1</label><label><input type="radio" name="elegedettseg" value="2">2</label><label><input type="radio" name="elegedettseg" value="3">3</label><label><input type="radio" name="elegedettseg" value="4">4</label><label><input type="radio" name="elegedettseg" value="5">5</label>  </div>
  <button type="button" id="ment">Mentés szövegfájlba</button>
  <p class="megjegyzes" id="info"></p>
</form>
<footer>11. évfolyam design tervezés 2026 ősz · Generálva: 2026-11-13 13:18</footer>
</div>
<script>
(function () {
  const KOD = "A6";
  const TAGOK = ["Csank\u00f3 Dominik", "Schmidt N\u00e1ndor"];
  const mezok = [['sikerult', 'Mi sikerült jól?'], ['nem_sikerult', 'Mi nem sikerült?'],
    ['munkamegosztas', 'Munkamegosztás'], ['maskepp', 'Mit csinálnánk másképp?']];
  document.getElementById('ment').addEventListener('click', function () {
    const e = document.querySelector('input[name="elegedettseg"]:checked');
    let s = 'Csapat-önértékelés – ' + KOD + '\r\nTagok: ' + TAGOK.join(', ') + '\r\nKészült: ' + new Date().toLocaleString('hu-HU') + '\r\n\r\n';
    mezok.forEach(function (m) { s += '## ' + m[1] + '\r\n' + document.getElementById(m[0]).value.trim().replace(/\n/g, '\r\n') + '\r\n\r\n'; });
    s += '## Elégedettség (1–5)\r\n' + (e ? e.value : '–') + '\r\n';
    const url = URL.createObjectURL(new Blob(['﻿' + s], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = KOD + '_onertekeles.txt';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    document.getElementById('info').textContent = 'Elmentve: ' + KOD + '_onertekeles.txt – töltsétek fel a leadással együtt.';
  });
})();
</script>
</body>
</html>
